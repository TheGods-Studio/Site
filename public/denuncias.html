<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Gods - Denúncias</title>
    <link rel="icon" type="image/png" href="Images/TheGods Studio - LOGO.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="site-theme.css">
    </head>
<body>
    <canvas id="matrix-canvas"></canvas>
    <img src="Images/TheGods Studio - LOGO.png" alt="The Gods Studio" class="auth-logo">
    <div class="auth-wrap">
        <div class="auth-card">
            <h1 class="auth-title">DENÚNCIAS</h1>
            <form id="report-form">
                <div class="form-group">
                    <label for="category">Categoria</label>
                    <select id="category" name="category" required>
                        <option value="">Selecione...</option>
                        <option value="Assédio">Assédio</option>
                        <option value="Ameaças">Ameaças</option>
                        <option value="Fraude">Fraude</option>
                        <option value="Spam">Spam</option>
                        <option value="Comportamento inadequado">Comportamento inadequado</option>
                        <option value="Violação das regras">Violação das regras</option>
                        <option value="Conteúdo ilegal">Conteúdo ilegal</option>
                        <option value="Outro">Outro</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="reported-users">Usuários denunciados (username ou ID, separados por vírgula)</label>
                    <input type="text" id="reported-users" name="reportedUsers" placeholder="usuario1, usuario2">
                </div>
                <div class="form-group">
                    <label for="description">Descrição</label>
                    <textarea id="description" name="description" required placeholder="Descreva o que aconteceu..."></textarea>
                </div>
                <div class="form-group">
                    <label>Anexos (imagens/vídeos)</label>
                    <input type="file" id="attachments" name="attachments" accept="image/png,image/jpeg,image/webp,video/mp4,video/webm" multiple>
                    <div class="file-list" id="file-list"></div>
                </div>
                <input type="hidden" id="attachment-paths" value="">
                <div class="auth-error" id="report-error"></div>
                <button type="submit" class="auth-submit">Enviar denúncia</button>
            </form>
            <a class="auth-home" href="index.html">← Voltar ao início</a>
        </div>
    </div>
    <div class="toast" id="toast"></div>
    <script src="site-theme.js"></script>
    <script>
    (function () {
      const API_BASE = '/api/public';
      const UPLOAD_API = '/api/admin/upload';
      let uploadedFiles = [];

      function escapeHtml(str) {
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }

      function toast(msg) {
        const el = document.getElementById('toast');
        if (!el) return;
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(el._t);
        el._t = setTimeout(() => el.classList.remove('show'), 3500);
      }

      async function apiFetch(path, opts) {
        opts = opts || {};
        const headers = Object.assign({ 'X-Requested-With': 'xmlhttprequest' }, opts.headers || {});
        if (opts.body && typeof opts.body !== 'string') {
          if (opts.body instanceof FormData) {
            delete headers['Content-Type'];
            opts.body = opts.body;
          } else {
            opts.body = JSON.stringify(opts.body);
            headers['Content-Type'] = 'application/json';
          }
        }
        const res = await fetch(path, Object.assign({}, opts, { headers }));
        let data = null;
        try { data = await res.json(); } catch (_) {}
        return { ok: res.ok, status: res.status, data };
      }

      async function uploadFiles(files) {
        const form = new FormData();
        for (let i = 0; i < files.length; i++) form.append('files', files[i]);
        const r = await apiFetch(UPLOAD_API, { method: 'POST', body: form });
        if (r.ok) return r.data.files || [];
        throw new Error(r.data.error || 'Falha no upload');
      }

      function renderFileList(files) {
        const list = document.getElementById('file-list');
        list.innerHTML = files.map(function (f, idx) {
          return '<div class="file-item"><span>' + escapeHtml(f.originalName || f.filename) + '</span><button data-idx="' + idx + '">Remover</button></div>';
        }).join('');
        list.querySelectorAll('button[data-idx]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            const i = parseInt(btn.getAttribute('data-idx'), 10);
            uploadedFiles.splice(i, 1);
            renderFileList(uploadedFiles);
          });
        });
      }

      document.getElementById('attachments').addEventListener('change', async function (e) {
        const files = Array.from(e.target.files || []);
        if (!files.length) return;
        try {
          toast('Enviando arquivos...');
          const uploaded = await uploadFiles(files);
          uploadedFiles = uploadedFiles.concat(uploaded);
          renderFileList(uploadedFiles);
          toast('Arquivos enviados.');
        } catch (err) {
          toast('Erro no upload: ' + err.message);
        }
      });

      document.getElementById('report-form').addEventListener('submit', async function (e) {
        e.preventDefault();
        const errEl = document.getElementById('report-error');
        errEl.textContent = '';
        const category = document.getElementById('category').value;
        const description = document.getElementById('description').value.trim();
        const reportedRaw = document.getElementById('reported-users').value.trim();
        if (!category || !description) { errEl.textContent = 'Preencha todos os campos obrigatórios.'; return; }
        const reportedUserIds = reportedRaw ? reportedRaw.split(',').map(function (s) { return s.trim(); }).filter(Boolean) : [];
        const btn = e.target.querySelector('button[type="submit"]');
        if (btn) btn.disabled = true;
        try {
          const r = await apiFetch(API_BASE + '/reports', {
            method: 'POST',
            body: { category: category, description: description, reportedUserIds: reportedUserIds, attachments: uploadedFiles }
          });
          if (r.ok) {
            toast('Denúncia enviada com sucesso.');
            uploadedFiles = [];
            renderFileList([]);
            e.target.reset();
          } else {
            errEl.textContent = (r.data && r.data.error) || 'Erro ao enviar denúncia.';
          }
        } catch (err) {
          errEl.textContent = 'Erro de conexão.';
        } finally {
          if (btn) btn.disabled = false;
        }
      });
    })();
    </script>
</body>
</html>
