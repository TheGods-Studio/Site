<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Gods - Conta Suspensa</title>
    <link rel="icon" type="image/png" href="Images/TheGods Studio - LOGO.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <!-- ESTILOS PADRONIZADOS -->
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="site-theme.css">
</head>
<body>
    <canvas id="matrix-canvas"></canvas>

    <div class="auth-wrap">
        <div class="auth-card" style="text-align: center;">
            <h1 class="auth-title" style="color: #ff5b6e;">CONTA SUSPENSA</h1>
            <p class="auth-switch">Sua conta foi suspensa por violação das regras da comunidade.</p>
            
            <div style="background: rgba(0,0,0,0.6); border: 1px solid rgba(255,91,110,0.4); border-radius: 8px; padding: 16px; margin: 20px 0; text-align: left;">
                <p style="font-family: 'Press Start 2P', cursive; font-size: 8px; color: #fff; margin: 0 0 10px;">
                    <strong>Motivo:</strong> <span id="ban-reason" style="color: #ff5b6e;">Não especificado</span>
                </p>
                <p style="font-family: 'Press Start 2P', cursive; font-size: 8px; color: #fff; margin: 0;">
                    <strong>Término:</strong> <span id="ban-end" style="color: #00ffea;">Permanente</span>
                </p>
            </div>

            <p class="auth-switch">Se acredita que isso é um erro, entre em contato conosco.</p>
            <div style="margin-top: 20px;">
                <a class="auth-home" href="index.html" style="font-size: 10px; color: var(--theme-cyan, #00ffea);">← Voltar ao Início</a>
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        document.getElementById('ban-reason').textContent = params.get('reason') || 'Não especificado';
        document.getElementById('ban-end').textContent = params.get('end') || 'Permanente';
    </script>
    <script src="site-theme.js"></script>
</body>
</html>
